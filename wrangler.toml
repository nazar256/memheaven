name = "memheaven"
main = "src/index.ts"
compatibility_date = "2026-05-13"
workers_dev = true

[[d1_databases]]
binding = "DB"
database_name = "memheaven_memory"
database_id = "52c7d3b4-e3b2-40cf-8887-bc83cfc724ea"

[[r2_buckets]]
binding = "MEMORY_BUCKET"
bucket_name = "memheaven-memory"

[ai]
binding = "AI"

[[vectorize]]
binding = "VECTORIZE"
index_name = "memheaven-memory"

[vars]
OAUTH_ISSUER = "https://memheaven.xyofn8h7t.workers.dev"
MCP_RESOURCE = "https://memheaven.xyofn8h7t.workers.dev/mcp"
MCP_AUDIENCE = "https://memheaven.xyofn8h7t.workers.dev/mcp"
EMBEDDING_MODEL = "@cf/baai/bge-small-en-v1.5"
EMBEDDING_DIMENSIONS = "384"
VECTORIZE_INDEX_NAME = "memheaven-memory"
PLAN_MODE = "free"
SEARCH_DEFAULT_LIMIT = "5"
SEARCH_MAX_LIMIT = "10"
DRAWER_MAX_CHARS = "64000"
DRAWER_DEFAULT_MAX_CHARS = "16000"
SEARCH_RESULT_MAX_CHARS = "4000"
DAILY_MAX_MCP_CALLS_PER_TENANT = "2000"
DAILY_MAX_WRITES_PER_TENANT = "100"
DAILY_MAX_VECTOR_QUERIES_PER_TENANT = "500"
DAILY_MAX_EMBEDDING_INPUT_CHARS_PER_TENANT = "500000"
