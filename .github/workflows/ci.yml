name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install --no-fund --no-audit
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx wrangler deploy --config wrangler.ci.toml --dry-run --outdir .tmp/wrangler-bundle
      - run: docker build -f Dockerfile.glama -t memheaven-glama:ci .
      - run: npm run smoke:glama -- docker memheaven-glama:ci
